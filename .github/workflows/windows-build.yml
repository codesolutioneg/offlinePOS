name: Build Windows app

# Builds a ready-to-run Windows app. Uses ONLY GitHub-authored actions (actions/*)
# and installs Flutter with a shell step, because the org's Actions policy blocks
# third-party actions (subosito/softprops), which failed the job at setup with no
# logs. actions/checkout and actions/upload-artifact are in the GitHub-owned
# actions org and are always allowed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (stable)
        shell: pwsh
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          echo "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flutter version
        run: flutter --version

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # pubspec.yaml is the single source of truth for the version; CI only adds the
      # run number as build metadata, so the app, the exe's file version and the
      # update manifest comparison all say the same release.
      - name: Build Windows
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $buildName = ($pubspecVersion -split '\+')[0]
          $buildNumber = "$env:GITHUB_RUN_NUMBER"
          $appVersion = "$buildName+$buildNumber"
          "Building $appVersion"
          flutter build windows --release --build-name=$buildName --build-number=$buildNumber --dart-define=APP_VERSION="$appVersion"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath offlinePOS-windows.zip -Force

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: offlinePOS-windows
          path: offlinePOS-windows.zip
          retention-days: 30
