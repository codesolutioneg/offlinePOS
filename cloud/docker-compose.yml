name: posbackup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posbackup
      POSTGRES_USER: posbackup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posbackup -d posbackup"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://posbackup:${POSTGRES_PASSWORD}@db:5432/posbackup
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      MAX_BACKUP_MB: ${MAX_BACKUP_MB:-1024}
      STORAGE_DIR: /data/backups
      WEB_DIR: /app/web
    volumes:
      - backups:/data/backups
      # The reports site (flutter build web -t lib/web_reports/main.dart), copied
      # here on deploy; a new build is live without rebuilding the image.
      - ./web:/app/web:ro
    # Not published to the internet: the reverse proxy in front reaches it here.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4555}:8080"

volumes:
  db:
  backups:
