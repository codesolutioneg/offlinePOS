name: owner_app
description: Dishflow owner mobile app — sales, costs, and open orders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#1B2838"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/dishflow_logo.png
    - assets/brand/dishflow_logo_on_dark.png
    - assets/brand/app_icon.png
    - assets/brand/app_icon_foreground.png
