# Builds a ready-to-run Windows app on AppVeyor (free for public repos, independent
# of the GitHub billing lock). AppVeyor pre-installs an older Flutter at C:\flutter,
# so the pinned one is cloned into a fresh dir and put first on PATH.
#
# No $ErrorActionPreference='Stop': git writes its normal "Cloning into..." to
# stderr, which under Stop aborts the whole script. Instead each native command's
# real exit code is checked, so the build fails only on an actual error.
image: Visual Studio 2022
clone_depth: 1

environment:
  # The Flutter this repo is known to build against, and the only line to change to
  # move it. Cloning `stable` meant a Flutter release could break the build
  # overnight with no change from us, which it did twice (a newer ListTile assertion
  # and a Windows-only temp-file lock). codemagic.yaml pins the same version; bump
  # the two together.
  FLUTTER_VERSION: 3.41.6

build_script:
  - ps: |
      git clone --depth 1 -b $env:FLUTTER_VERSION https://github.com/flutter/flutter.git C:\fsdk
      if ($LASTEXITCODE -ne 0) { throw "flutter clone failed" }
      $env:PATH = "C:\fsdk\bin;$env:PATH"
      flutter --version
      # pubspec.yaml is the single source of truth for the version. CI only adds the
      # build number, as build metadata, so the app, the exe's file version and the
      # manifest comparison all say the same release.
      $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
      $buildName = ($pubspecVersion -split '\+')[0]
      $buildNumber = if ($env:APPVEYOR_BUILD_NUMBER) { $env:APPVEYOR_BUILD_NUMBER } else { "0" }
      $appVersion = "$buildName+$buildNumber"
      "Building $appVersion"
      flutter pub get;                 if ($LASTEXITCODE -ne 0) { throw "pub get failed" }
      flutter analyze;                 if ($LASTEXITCODE -ne 0) { throw "analyze failed" }
      # The image's system sqlite3.dll is too old for the schema's ON CONFLICT
      # (UPSERT) statements, so fetch a modern one and point the test loader at it.
      Invoke-WebRequest "https://sqlite.org/2024/sqlite-dll-win-x64-3460100.zip" -OutFile sqlite.zip
      if ($LASTEXITCODE -ne 0) { throw "sqlite download failed" }
      Expand-Archive -Path sqlite.zip -DestinationPath sqlite-dll -Force
      $env:SQLITE3_DLL = (Resolve-Path .\sqlite-dll\sqlite3.dll).Path
      "Using sqlite: $env:SQLITE3_DLL"
      flutter test;                    if ($LASTEXITCODE -ne 0) { throw "tests failed" }
      flutter build windows --release --build-name=$buildName --build-number=$buildNumber --dart-define=APP_VERSION="$appVersion"; if ($LASTEXITCODE -ne 0) { throw "windows build failed" }

      # Authenticode signing. Windows calls an unsigned build "Unknown publisher"
      # and SmartScreen blocks it on first run, so the exe is signed whenever a
      # certificate is configured. Inert without one: a fork or a first-time build
      # still produces a working, merely unsigned, app rather than failing.
      #
      # CODESIGN_PFX_BASE64 and CODESIGN_PASSWORD are AppVeyor secure variables.
      # Never commit either. Encrypt them at
      # https://ci.appveyor.com/tools/encrypt and set them on the project, so the
      # values never appear in this file or in a build log.
      if ($env:CODESIGN_PFX_BASE64) {
        "Signing as $env:CODESIGN_PUBLISHER"
        $pfx = Join-Path $env:TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
        $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                     Sort-Object FullName | Select-Object -Last 1).FullName
        if (-not $signtool) { throw "signtool not found" }
        # The timestamp is what keeps the signature valid after the certificate
        # expires. Without it every installed till starts failing its signature
        # check on the day the cert runs out.
        & $signtool sign /f $pfx /p $env:CODESIGN_PASSWORD `
          /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
          .\build\windows\x64\runner\Release\offline_pos.exe
        if ($LASTEXITCODE -ne 0) { throw "signing failed" }
        # Checked with Get-AuthenticodeSignature rather than `signtool verify /pa`,
        # and the difference matters. /pa asks whether the chain is trusted BY THIS
        # MACHINE, and a build agent has never heard of our own certificate, so a
        # self-signed release would fail here having signed perfectly well. What is
        # worth failing on is a signature that is missing or does not match the
        # bytes; whether a root is trusted is the till's question, answered by
        # install-till.ps1, not the build's.
        $sig = Get-AuthenticodeSignature .\build\windows\x64\runner\Release\offline_pos.exe
        "Signature status: $($sig.Status)"
        if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
          throw "signature did not verify: $($sig.Status)"
        }
        if ($sig.Status -ne 'Valid') {
          # Expected while the certificate is our own. A bought one reads Valid.
          "Signed, and the root is not trusted on this agent, which is expected for a self-signed certificate."
        }
        "Signed by: $($sig.SignerCertificate.Subject)"
        Remove-Item $pfx -Force
      } else {
        "No signing certificate configured, shipping unsigned."
      }

      7z a offlinePOS-windows.zip .\build\windows\x64\runner\Release\*
      if ($LASTEXITCODE -ne 0) { throw "packaging failed" }

artifacts:
  - path: offlinePOS-windows.zip
    name: offlinePOS-windows

deploy: off
